name: Täglicher Lauf (Andacht veröffentlichen + Telegram)

# RESERVE-Auslöser. Der zuverlässige, minutengenaue Auslöser ist ein externer
# Cron-Dienst (z. B. cron-job.org, in deutscher Zeit eingestellt) – siehe README,
# Abschnitt „Hinweis zum Zeitplan". Dieser Workflow springt zusätzlich ein, falls
# der externe Dienst einmal ausfällt. Er ruft mehrmals morgens den bestehenden
# Endpunkt `api/taeglich` auf. Der stößt einen neuen Seitenbau an (macht
# vordatierte Andachten sichtbar) und meldet fällige Andachten an Telegram/E-Mail.
# Die Logik (Fälligkeit, Sichtbar-/Melde-Stunde, Doppel-Schutz) bleibt im Endpunkt.

on:
  schedule:
    # GitHub-Cron rechnet in UTC. Der Endpunkt trennt zwei Phasen (deutscher Zeit):
    # VERÖFFENTLICHEN ab 4 Uhr, MELDEN (Telegram/Newsletter) ab 6 Uhr. Deshalb hier
    # sowohl Läufe im 4–6-Uhr-Fenster (damit die Andacht vor 6 Uhr online ist) als
    # auch nach 6 Uhr (für die Meldung) – jeweils ganzjährig, also für Sommer- wie
    # Winterzeit. Minuten bewusst ungerade (nicht :00), weil GitHub Läufe zur vollen
    # Stunde am stärksten verzögert. GitHub kann geplante Läufe verzögern; das
    # verschiebt sie nur nach HINTEN (unkritisch). Doppelte Meldungen sind durch
    # telegram-/newsletter-gesendet.json ausgeschlossen, doppelte Deploys durch die
    # neubauNoetig-Prüfung.
    #   03:17 UTC = 04:17 (Winter) / 05:17 (Sommer) → Veröffentlichen (vor 6 Uhr)
    #   03:47 UTC = 04:47 (Winter) / 05:47 (Sommer) → Veröffentlichen (vor 6 Uhr)
    #   05:17 UTC = 06:17 (Winter) / 07:17 (Sommer) → Melden (Telegram/Newsletter)
    #   06:47 UTC = 07:47 (Winter) / 08:47 (Sommer) → Reserve-Meldung
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 5 * * *"
    - cron: "47 6 * * *"
  # Manuell aus dem Actions-Tab startbar (zum Testen).
  workflow_dispatch:
    inputs:
      force:
        description: "6-Uhr-Sperre umgehen (sofort ausführen, nur zum Testen)"
        type: boolean
        default: false

# Nie zwei Läufe gleichzeitig (z. B. Reserve-Lauf trifft manuellen Start).
concurrency:
  group: taeglich
  cancel-in-progress: false

jobs:
  anstossen:
    runs-on: ubuntu-latest
    steps:
      - name: api/taeglich aufrufen
        env:
          # Öffentliche Adresse der Seite (siehe src/_data/site.js → url).
          BASIS_URL: https://gfdt-andachten.de
          # Muss mit dem CRON_SECRET in Vercel übereinstimmen. Als GitHub-Secret
          # hinterlegen: Repo → Settings → Secrets and variables → Actions.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Nur bei manuellem Start und angehaktem Häkchen "force".
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -uo pipefail
          # WICHTIG: Schrägstrich am Ende! vercel.json hat "trailingSlash": true,
          # d. h. Vercel leitet /api/taeglich per 308 auf /api/taeglich/ um. Ohne
          # den Schrägstrich (und ohne -L bei curl) landete der Aufruf nur auf der
          # Weiterleitung – die Funktion lief nie, der Lauf galt aber als "grün".
          url="$BASIS_URL/api/taeglich/"
          if [ "${FORCE:-false}" = "true" ]; then
            url="$url?force=1"
          fi
          echo "Rufe $url auf ..."
          # -L: Weiterleitungen trotzdem folgen (Sicherheitsnetz, falls sich die
          # Adresse einmal ändert). --write-out liefert den finalen HTTP-Status.
          code=$(curl -sS -L -m 60 --retry 3 --retry-delay 10 --retry-all-errors \
            -o antwort.txt -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$url") || { echo "::error::curl-Aufruf fehlgeschlagen (Netzwerk)"; exit 1; }
          echo "HTTP-Status: $code"
          echo "Antwort des Endpunkts:"
          cat antwort.txt 2>/dev/null || true
          echo
          # Nur echte 2xx-Antworten sind ein Erfolg. Eine 3xx-Weiterleitung, die
          # nicht aufgelöst werden konnte, bedeutet: der Endpunkt wurde NICHT
          # ausgeführt – das muss der Lauf als Fehler melden (früher unsichtbar).
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::api/taeglich meldete HTTP $code – Lauf fehlgeschlagen. Bei 401 das GitHub-Secret CRON_SECRET prüfen (muss dem Wert in Vercel entsprechen); bei 3xx stimmt die Adresse/Weiterleitung nicht."
            exit 1
          fi
          echo "Fertig."
