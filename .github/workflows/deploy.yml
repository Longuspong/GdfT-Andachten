name: Website bauen und veröffentlichen

# Bei jedem Push auf den Haupt-Branch wird die Seite neu gebaut und
# auf GitHub Pages veröffentlicht. Manuell auslösbar über "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte für die Veröffentlichung auf GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Bau-Ergebnis hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
